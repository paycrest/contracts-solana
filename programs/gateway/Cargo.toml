[package]
name = "gateway"
version = "0.1.0"
description = "Paycrest Gateway Solana program"
edition = "2021"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "gateway"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
